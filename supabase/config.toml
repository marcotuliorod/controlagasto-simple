# Configuração do Supabase para desenvolvimento local e self-host.
#
# Antes esta era a config mínima gerada pela Lovable: só `project_id` (o da
# Lovable Cloud) e o `verify_jwt` de cada function. Sem as seções abaixo,
# `supabase start` não sobe um stack utilizável.

project_id = "entenda-seus-gastos"

[api]
enabled = true
port = 54321
# `extensions` precisa estar no search_path: as migrations instalam pg_cron ali.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Igual ao do projeto remoto (verificado: Postgres 17.6). Antes estava 15, que
# era palpite meu — rodar local numa major diferente da produção esconde
# incompatibilidade justamente onde ela apareceria primeiro.
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Captura e-mails de signup/recuperação em desenvolvimento, sem enviar de verdade.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Mesmo limite que o app documenta para upload de recibo.
file_size_limit = "5MiB"

[auth]
enabled = true
# Precisa bater com a porta do Vite (vite.config.ts: server.port = 8080).
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Em desenvolvimento, não exige confirmar e-mail para poder testar o fluxo.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# -----------------------------------------------------------------------------
# Edge Functions
#
# verify_jwt = false nas 3 disparadas por cron e na de chave VAPID: não há
# usuário final para autenticar, então elas usam X-Cron-Secret / checagem
# própria em vez do gate da plataforma.
# -----------------------------------------------------------------------------

[functions.export-data]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.notify-goal-threshold]
verify_jwt = false

[functions.generate-insights]
verify_jwt = true

[functions.export-pdf]
verify_jwt = true

[functions.check-category-variations]
verify_jwt = true

[functions.send-push-notification]
verify_jwt = true

[functions.get-vapid-public-key]
verify_jwt = false

[functions.process-scheduled-exports]
verify_jwt = false

[functions.process-recurring-expenses]
verify_jwt = false

[functions.chat-assistant]
verify_jwt = true

[functions.process-import-file]
verify_jwt = true
