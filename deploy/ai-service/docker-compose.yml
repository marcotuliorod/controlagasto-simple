services:
  ai:
    build:
      context: ./repo/services/ai
    image: entenda-ai:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8787"
    # Sem "ports:" de propósito — quem fala com o mundo é o Traefik já
    # provisionado pela Hostinger (/docker/traefik, network_mode: host,
    # ocupa 80/443). Ele descobre este serviço pelas labels abaixo, do
    # mesmo jeito que os apps do "Docker Compose Catalog" da Hostinger
    # (ex. o container "openclaw" já rodando na VPS antes deste deploy).
    labels:
      - traefik.enable=true
      - traefik.http.routers.entenda-ai.entrypoints=websecure
      - traefik.http.routers.entenda-ai.rule=Host(`${AI_DOMAIN}`)
      - traefik.http.routers.entenda-ai.tls.certresolver=letsencrypt
      - traefik.http.services.entenda-ai.loadbalancer.server.port=8787
