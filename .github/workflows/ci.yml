name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript type check
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Vitest
        run: npm run test -- --run --reporter=verbose
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: coverage/

  # As edge functions rodam em Deno, então `supabase/**` está excluído do
  # Vitest (ver vite.config.ts) e os testes de `_shared/` usam `Deno.test`.
  # Sem este job eles existem e nunca rodam: os 20 testes do parser de extrato
  # ficaram assim desde que foram escritos.
  edge-function-tests:
    name: Edge Function Tests (Deno)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --allow-net porque os imports vêm de deno.land/esm.sh, não porque os
      # testes acessem rede: são todos determinísticos, sem Supabase e sem IA.
      # --allow-read para as fixtures em _shared/fixtures/, que são a saída real
      # de extractPdfText() sobre PDF de banco e ficam em arquivo justamente
      # para poderem ser conferidas contra o documento original.
      - name: Run Deno tests
        run: deno test --allow-net --allow-read supabase/functions/_shared/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Stack efêmero por execução. Os testes criam usuário de verdade
      # (test-<timestamp>@example.com) e completam o onboarding; apontar para um
      # Supabase compartilhado encheria o banco de lixo a cada push. Além disso,
      # teste hermético não depende de estado deixado por execução anterior.
      - name: Start local Supabase
        run: |
          npx supabase start
          # `supabase status -o env` expõe as chaves geradas para esta execução.
          # São as chaves demo padrão do stack local, não segredos.
          API_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)
          PUB_KEY=$(npx supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d'"' -f2)
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUB_KEY" >> "$GITHUB_ENV"

      # `supabase start` sobe o edge-runtime junto, mas ele morre calado quando
      # falta memória — e o sintoma vira teste de export vermelho, não erro de
      # infra. Aconteceu no desenvolvimento local (container Exited 137) e custou
      # horas até alguém olhar `docker ps -a`. 503 aqui = Kong sem upstream =
      # runtime fora; 401 é o gateway pedindo token, ou seja, function no ar.
      - name: Verificar que as edge functions respondem
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "$VITE_SUPABASE_URL/functions/v1/get-vapid-public-key")
          echo "get-vapid-public-key -> $CODE"
          if [ "$CODE" = "503" ]; then
            docker logs "$(docker ps -aqf name=edge_runtime)" 2>&1 | tail -30
            echo "::error::edge-runtime fora do ar; os testes de export falhariam sem explicar por quê"
            exit 1
          fi

      # Só os projetos baseados em chromium, que é o único navegador instalado
      # acima. O playwright.config.ts declara 5 projetos; rodar todos aqui faz
      # firefox, webkit e Mobile Safari falharem por binário ausente. Ligar os
      # outros é questão de instalar os binários (custo de minuto de runner),
      # não de dívida na suíte — a quarentena acabou.
      #
      # Os dois projetos dividem UM usuário e UM banco (mesmo storageState),
      # então dado criado no chromium é visível no Mobile Chrome. Os specs lidam
      # com isso sorteando nome por execução (`uniqueLabel`).
      - name: Run Playwright tests
        run: npx playwright test --project=chromium --project="Mobile Chrome"

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/e2e/
          retention-days: 30
      
      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: artifacts/e2e/screenshots/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # Mesmo motivo do job de e2e: o app precisa de configuração válida do
      # Supabase para renderizar. Sem ela, `src/integrations/supabase/client.ts`
      # falha no boot de propósito, e o Lighthouse audita uma página em branco
      # (NO_FCP) em vez do app.
      - name: Start local Supabase
        run: |
          npx supabase start
          API_URL=$(npx supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)
          PUB_KEY=$(npx supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d'"' -f2)
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUB_KEY" >> "$GITHUB_ENV"

      - name: Build app
        run: npm run build

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
      
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: artifacts/lighthouse/
          retention-days: 30

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
